<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title description">
  <title id="title">Inkstone Markdown image example</title>
  <desc id="description">The Inkstone project logo beside text confirming that Markdown images render correctly.</desc>
  <rect width="720" height="240" rx="28" fill="#f5f4f1"/>
  <g transform="translate(42 42) scale(4.875)">
    <!-- 底层：整块完整蓝色 -->
    <path d="M6 2.5h20c0.8 0 1.5 0.7 1.5 1.5v24c0 0.8-0.7 1.5-1.5 1.5H6C5.2 28.5 4.5 27.8 4.5 27V4c0-0.8 0.7-1.5 1.5-1.5z" fill="#0978dd"/>
    <!-- 上层叠加白色竖长条（直接盖在蓝色上面） -->
    <rect x="7" y="2.5" width="1.6" height="27" fill="#ffffff"/>
    <!-- 蓝色整体外白色边框 -->
    <path d="M6 2.5C5.2 2.5 4.5 3.2 4.5 4v24c0 0.8 0.7 1.5 1.5 1.5h20c0.8 0 1.5-0.7 1.5-1.5V4c0-0.8-0.7-1.5-1.5-1.5H6z" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <!--尖角朝左，绿色书签 -->
    <path d="M21 2.5h-7v5.6l2.6 3.2a1 1 0 0 0 1.4.2l3-2.2 1.8-1.4V2.5z" fill="#28d1a0"/>
    <!-- 绿色书签内白色小圆 cx横坐标 cy纵坐标 r半径 -->
    <circle cx="18" cy="7.8" r="0.75" fill="#ffffff"/>
    <!-- 书签白色描边 -->
    <path d="M21 2.5h-7v5.6l2.6 3.2a1 1 0 0 0 1.4.2l3-2.2 1.8-1.4V2.5z" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <text x="238" y="112" fill="#202124" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700">G笔记</text>
  <text x="238" y="158" fill="#686763" font-family="Inter, system-ui, sans-serif" font-size="24">Markdown image example</text>
</svg>