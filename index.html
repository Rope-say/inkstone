<!doctype html>
<html lang="en-US" data-theme="light" data-accent="cinnabar" data-background="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A private, self-hosted Markdown notebook built on Cloudflare." />
    <meta name="theme-color" content="#1a1817" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="G笔记" />
    <title>G笔记</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" 
	  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 2.5h20c0.8 0 1.5 0.7 1.5 1.5v24c0 0.8-0.7 1.5-1.5 1.5H6C5.2 28.5 4.5 27.8 4.5 27V4c0-0.8 0.7-1.5 1.5-1.5z' fill='%230978dd'/%3E%3Crect x='7' y='2.5' width='1.6' height='27' fill='%23ffffff'/%3E%3Cpath d='M6 2.5C5.2 2.5 4.5 3.2 4.5 4v24c0 0.8 0.7 1.5 1.5 1.5h20c0.8 0 1.5-0.7 1.5-1.5V4c0-0.8-0.7-1.5-1.5-1.5H6z' fill='none' stroke='%23ffffff' stroke-width='1.2' stroke-linejoin='round'/%3E%3Cpath d='M21 2.5h-7v5.6l2.6 3.2a1 1 0 0 0 1.4.2l3-2.2 1.8-1.4V2.5z' fill='%2328d1a0'/%3E%3Ccircle cx='18' cy='7.8' r='0.75' fill='%23ffffff'/%3E%3Cpath d='M21 2.5h-7v5.6l2.6 3.2a1 1 0 0 0 1.4.2l3-2.2 1.8-1.4V2.5z' fill='none' stroke='%23ffffff' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E" 
	/>


    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('inkstone.ui')
          var saved = raw ? JSON.parse(raw) : null
          var pref = (saved && saved.theme) || 'system'
          var accent = (saved && saved.accent) || 'cinnabar'
          var background = saved && saved.background === 'white' ? 'white' : 'paper'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.dataset.accent = accent
          root.dataset.background = background
          var storedLocale = localStorage.getItem('inkstone-locale')
          var locale =
            storedLocale === 'zh-CN' || storedLocale === 'en-US'
              ? storedLocale
              : saved && (saved.language === 'zh-CN' || saved.language === 'en-US')
                ? saved.language
                : navigator.language.toLowerCase().startsWith('zh')
                  ? 'zh-CN'
                  : 'en-US'
          root.lang = locale
          document.title = 'G笔记'
          var description = document.querySelector('meta[name="description"]')
          if (description) {
            description.content = 'A private, self-hosted Markdown notebook built on Cloudflare.'
          }
          if (saved && saved.fontScale) {
            root.style.setProperty('--prose-size', saved.fontScale + 'px')
          }
        } catch (e) {

        }
      })()
    </script>

    <style>

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: light-dark(#faf9f7, #1a1817);
        z-index: 9999;
        transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }
      html[data-theme='light'] #boot { background: #faf9f7; }
      html[data-theme='light'][data-background='white'] #boot { background: #fff; }
      html[data-theme='dark'] #boot { background: #1a1817; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot svg { width: 34px; height: 34px; animation: bootPulse 1.5s ease-in-out infinite; }
      @keyframes bootPulse {
        0%, 100% { opacity: 0.28; transform: scale(0.97); }
        50% { opacity: 0.85; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
     <svg viewBox="0 0 32 32" fill="none">
    <path d="M6 2.5h20c0.8 0 1.5 0.7 1.5 1.5v24c0 0.8-0.7 1.5-1.5 1.5H6C5.2 28.5 4.5 27.8 4.5 27V4c0-0.8 0.7-1.5 1.5-1.5z" fill="#0978dd"/>
    <rect x="7" y="2.5" width="1.6" height="27" fill="#ffffff"/>
    <path d="M6 2.5C5.2 2.5 4.5 3.2 4.5 4v24c0 0.8 0.7 1.5 1.5 1.5h20c0.8 0 1.5-0.7 1.5-1.5V4c0-0.8-0.7-1.5-1.5-1.5H6z" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M21 2.5h-7v5.6l2.6 3.2a1 1 0 0 0 1.4.2l3-2.2 1.8-1.4V2.5z" fill="#28d1a0"/>
    <circle cx="18" cy="7.8" r="0.75" fill="#ffffff"/>
    <path d="M21 2.5h-7v5.6l2.6 3.2a1 1 0 0 0 1.4.2l3-2.2 1.8-1.4V2.5z" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
		</svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
